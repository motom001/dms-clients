name: Wunsch für einen Client · Wish for a client
description: Eine neue Funktion oder Änderung an einem Client · A new feature or change for a client
labels: [wunsch]
body:
  - type: markdown
    attributes:
      value: |
        Deutsch oder Englisch – beides ist willkommen. **Bitte keine echten Daten**, nur erfundene Beispiele (z. B. Lena, Jonas).
        Braucht dein Wunsch eine neue Schnittstelle im DMS? Dann gehört dieser Teil ins Repository [motom001/dms](https://github.com/motom001/dms/issues/new/choose). Einen ganz neuen Client schlägst du mit der Vorlage „Neuer Client“ vor.
  - type: dropdown
    id: client
    attributes:
      label: Welcher Client? · Which client?
      options:
        - Homey (homey)
        - Home Assistant (homeassistant)
        - App für iPhone und iPad (ios)
        - App für Android (android)
        - Office-Add-in (office)
        - Thunderbird (thunderbird)
        - Browser-Erweiterung (browser)
        - Kurzbefehle (kurzbefehle)
        - Beispiele und Skripte (beispiele)
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: "**Als** <Rolle> **möchte ich** <was>, **damit** <wozu>. · **As a** <role> **I want** <what>, **so that** <why>."
    validations:
      required: true
  - type: textarea
    id: kriterien
    attributes:
      label: Akzeptanzkriterien · Acceptance criteria
      value: |
        - [ ] …
        - [ ] …
  - type: dropdown
    id: fuerwen
    attributes:
      label: Für wen? · Who is it for?
      description: "Die Personas · The personas (German): https://motom001.github.io/dms/entwickler/aktuell/personas/"
      multiple: true
      options:
        - Einsteiger-Familie
        - Familienmitglied
        - Haushalts-Admin
        - Für die Eltern sorgen
        - Vermieter
        - Selbständige
        - Kleinbetrieb
  - type: textarea
    id: hinweise
    attributes:
      label: Hinweise · Notes
      description: Beispiele, Skizzen, offene Fragen · Examples, sketches, open questions
  - type: markdown
    attributes:
      value: Umgesetzt wird erst, wenn der Maintainer das Label „freigegeben“ gesetzt hat. · Work starts only after the maintainer has set the label "freigegeben" (approved).
