# Grundprüfung für alle Pull Requests und main: Aufbau der Client-Ordner und Signed-off-by.
# Jeder Client bringt später eigene Schritte mit (Build, Tests) – als eigener Job oder eigener Workflow.
name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Jeder Client-Ordner hat README.md und CHANGELOG.md
        run: |
          shopt -s nullglob
          fehler=0
          for d in */; do
            d="${d%/}"
            case "$d" in .github) continue ;; esac
            for f in README.md CHANGELOG.md; do
              if [ ! -f "$d/$f" ]; then echo "::error::$d/ braucht $f (siehe CONTRIBUTING.md)"; fehler=1; fi
            done
          done
          exit $fehler
      - name: Signed-off-by in allen Commits des Pull Requests
        if: github.event_name == 'pull_request'
        env:
          BASIS: origin/${{ github.base_ref }}
          KOPF: ${{ github.event.pull_request.head.sha }}
        run: |
          fehlt=$(git log --no-merges --format='%H %s%n%b%n--ENDE--' "$BASIS..$KOPF" | awk '/^[0-9a-f]{40} /{c=$1; ok=0} /^Signed-off-by: /{ok=1} /^--ENDE--$/{ if(!ok) print c }')
          if [ -n "$fehlt" ]; then echo "::error::Commits ohne Signed-off-by (git commit -s): $fehlt"; exit 1; fi
