# Tags und Releases je Client (#9): Bei jedem Push auf main bekommt jede Client-Version, für die es noch keinen
# Tag <ordner>-v<version> gibt, Tag und Release – mit dem passenden Abschnitt aus <ordner>/CHANGELOG.md als Text.
# Die Logik steht in .github/scripts/releases.sh; die Probe für Pull Requests läuft im Workflow „Prüfen“.
# Bestehende Tags und Releases werden nie verändert. Danach:
# - Den Python-Client (python/, #22) lädt der Job „pypi“ hoch, sobald seine Version noch nicht auf PyPI steht.
# - Die Homey-App (homey/, #12) lädt der Job „homey“ zu Athom hoch, wenn ein neues Release homey-v… entstanden ist;
#   freigeben im Homey App Store bleibt Handarbeit.
# - Die Integration für Home Assistant (homeassistant/) bekommt das Archiv ablago.zip am Release (Job „homeassistant“).
name: Release

on:
  push:
    branches: [main]

# Grundsätzlich nur lesen; Schreibrechte bekommt nur der Job, der Tag und Release anlegt.
permissions:
  contents: read

# Zwei Pushs kurz hintereinander nicht gleichzeitig: sonst versuchen beide denselben Tag anzulegen.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag_homey: ${{ steps.anlegen.outputs.tag_homey }}
      tag_homeassistant: ${{ steps.anlegen.outputs.tag_homeassistant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tags und Releases für neue Versionen anlegen
        id: anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          ZIEL: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/releases.sh anlegen

  # Python-Client auf PyPI (#22) über Trusted Publishing: PyPI vertraut genau diesem Workflow (release.yml) in der
  # Umgebung „pypi“ – ohne gespeichertes Passwort oder Token. Läuft erst, wenn die Variable PYPI_VEROEFFENTLICHEN
  # auf „ja“ steht (nach der Einrichtung bei PyPI, python/README.md). Hochgeladen wird nur eine Version, die es auf
  # PyPI noch nicht gibt; so ist ein zweiter Lauf auf demselben Stand harmlos.
  pypi:
    name: Python-Client auf PyPI
    needs: release
    if: vars.PYPI_VEROEFFENTLICHEN == 'ja'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ablago/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Schon auf PyPI?
        id: stand
        run: |
          version=$(tr -d '[:space:]' < python/VERSION)
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/ablago/$version/json")
          if [ "$code" = 200 ]; then
            echo "neu=false" >> "$GITHUB_OUTPUT"; echo "ablago $version steht schon auf PyPI – nichts zu tun." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.stand.outputs.neu == 'true'
        with:
          python-version: '3.13'
      - name: Erzeugen und bauen
        if: steps.stand.outputs.neu == 'true'
        working-directory: python
        run: |
          pip install -r werkzeuge/anforderungen-erzeugen.txt -r anforderungen-test.txt
          python werkzeuge/erzeugen.py
          python -m build
          twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.stand.outputs.neu == 'true'
        with:
          packages-dir: python/dist/
      - name: Ergebnis
        if: steps.stand.outputs.neu == 'true'
        env:
          VERSION: ${{ steps.stand.outputs.version }}
        run: echo "ablago $VERSION auf PyPI veröffentlicht – https://pypi.org/project/ablago/$VERSION/" >> "$GITHUB_STEP_SUMMARY"

  # Homey-App zu Athom hochladen (#12), nur für ein neu angelegtes Release homey-v…; Einzelheiten und Voraussetzungen
  # im Workflow homey-veroeffentlichen.yml.
  homey:
    name: Homey-App zu Athom
    needs: release
    if: needs.release.outputs.tag_homey != ''
    permissions:
      contents: read
    uses: ./.github/workflows/homey-veroeffentlichen.yml
    with:
      tag: ${{ needs.release.outputs.tag_homey }}

  # Integration für Home Assistant: das Archiv ablago.zip ans neue Release homeassistant-v… hängen. Es enthält den
  # Ordner custom_components/ablago und dient der Installation von Hand (homeassistant/README.md).
  homeassistant:
    name: Home Assistant – Archiv am Release
    needs: release
    if: needs.release.outputs.tag_homeassistant != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag_homeassistant }}
          persist-credentials: false
      - name: ablago.zip bauen und anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag_homeassistant }}
        run: |
          cd homeassistant/custom_components
          zip -r -X ../../ablago.zip ablago -x '*/__pycache__/*'
          cd ../..
          unzip -l ablago.zip | tail -n +1
          test "$(unzip -p ablago.zip ablago/manifest.json | jq -r .version)" = "${TAG#homeassistant-v}" || { echo "::error::manifest.json passt nicht zu $TAG"; exit 1; }
          gh release upload "$TAG" ablago.zip
          echo "ablago.zip hängt am Release $TAG." >> "$GITHUB_STEP_SUMMARY"
