<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Ablago, Homey Pro und Flow: Homey fragt die Zahlen ab und löst Flows aus (erfundene Werte)</title>
  <rect width="1180" height="300" rx="16" fill="#F4F7FA"/>
  <defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1F4E79"/></marker></defs>
  <g fill="#fff" stroke="#1F4E79" stroke-width="3">
    <rect x="20" y="50" width="300" height="200" rx="14"/>
    <rect x="440" y="50" width="300" height="200" rx="14"/>
    <rect x="860" y="50" width="300" height="200" rx="14"/>
  </g>
  <g fill="#1F4E79" font-size="24" font-weight="bold" text-anchor="middle">
    <text x="170" y="95">Ablago</text>
    <text x="590" y="95">Homey Pro</text>
    <text x="1010" y="95">Flow</text>
  </g>
  <g fill="#333" font-size="17" text-anchor="middle">
    <text x="170" y="140">dms.home.arpa</text>
    <text x="170" y="172">Schlüssel „nur Zähler“</text>
    <text x="170" y="204">nur Zahlen, keine Inhalte</text>
    <text x="590" y="140">Gerät „Ablago“</text>
    <text x="590" y="172">Neue Post 2 · Zu erledigen 5</text>
    <text x="590" y="204">Fällig in 7 Tagen 3 · Überfällig 1</text>
    <text x="1010" y="140">Wenn: Neue Post angekommen</text>
    <text x="1010" y="172">Dann: Lampe im Flur an</text>
    <text x="1010" y="204">oder Mitteilung ans Handy</text>
  </g>
  <g stroke="#1F4E79" stroke-width="3" fill="none" marker-end="url(#p)">
    <path d="M436 130 H326"/>
    <path d="M324 180 H434"/>
    <path d="M744 155 H854"/>
  </g>
  <g fill="#555" font-size="14" text-anchor="middle">
    <text x="380" y="118">alle 5 Min.</text>
    <text x="380" y="204">Zahlen / 304</text>
    <text x="799" y="143">Auslöser</text>
